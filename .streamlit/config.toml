[theme]
primaryColor = "#6b8aed"
backgroundColor = "#111318"
secondaryBackgroundColor = "#181b22"
textColor = "#dfe2e8"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[server]
headless = true
port = 8501
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
